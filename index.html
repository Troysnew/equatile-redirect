<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equatile is now Equacross</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://equacross.com/">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f1f5ec; color: #1b271c; text-align: center; padding: 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #0e1611; color: #e4ecdd; } a { color: #f07261; } }
  a { color: #c23a2b; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Equatile is now Equacross</h1>
  <p>Taking you to <a id="go" href="https://equacross.com/">equacross.com</a>…</p>
</main>
<script>
// Forward everything to equacross.com. The first time, also carry this browser's saved games,
// since saved games live with the old address and wouldn't follow the move on their own.
(function () {
  var NEW = 'https://equacross.com';
  var path = location.pathname || '/', hash = location.hash || '', payload = '';
  try {
    if (!localStorage.getItem('equatile.moved')) {
      var data = {}, n = 0;
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('equatile.') === 0) { data[k] = localStorage.getItem(k); n++; }
      }
      if (n) {
        payload = btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        localStorage.setItem('equatile.moved', '1');
      }
    }
  } catch (e) { payload = ''; }
  var target;
  if (payload) target = NEW + '/play/#import=' + payload + (hash.length > 1 ? '~' + hash.slice(1) : '');
  else target = NEW + path + location.search + hash;
  document.getElementById('go').href = target;
  location.replace(target);
})();
</script>
</body>
</html>
